name: build image

# Build image web + bot, lalu kirim ke GitHub Container Registry.
# Server cukup: docker compose pull && docker compose up -d
#
# Rahasia yang dipakai: GITHUB_TOKEN bawaan (untuk GHCR), tidak perlu diset manual.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nama: web
            konteks: ./aplikasi-pkl
          - nama: bot
            konteks: ./aplikasipkl-bot
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.nama }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.konteks }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nama }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nama }}

  # Deploy otomatis opsional. Aktifkan bila server sudah punya kunci SSH.
  # Rahasia yang perlu dibuat di GitHub: SSH_HOST, SSH_USER, SSH_KEY, SSH_PATH
  # (SSH_PATH = folder berisi docker-compose.yml di server).
